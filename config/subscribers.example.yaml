    phone: "+9779800000006"
    webhook_url: https://ops.example.org/himsat
    channels: [sms, webhook]
    min_level: medium
    bbox: [85.15, 27.98, 85.40, 28.30]
  - name: Langtang lodge association
    org_type: tourism
    language: both

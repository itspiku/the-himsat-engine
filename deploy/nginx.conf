# Example reverse proxy for HimSat (TLS termination, admin rate limiting).
# Certificates: e.g. certbot --nginx -d himsat.example.org
limit_req_zone $binary_remote_addr zone=himsat_admin:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=himsat_api:10m rate=20r/s;

server {
    listen 80;
    server_name himsat.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name himsat.example.org;
    ssl_certificate     /etc/letsencrypt/live/himsat.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/himsat.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css application/xml;
    client_max_body_size 1m;

    location /api/admin/ {
        limit_req zone=himsat_admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location /metrics {
        allow 10.0.0.0/8;          # scrape from the monitoring network only
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        limit_req zone=himsat_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}

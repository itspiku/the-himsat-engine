[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himsat"
version = "1.0.0"
description = "HimSat Engine — open-source satellite early warning for Himalayan glacier and glacial-lake hazards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HimSat Engine contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "timm>=0.9",
    "einops>=0.7",
    "huggingface_hub>=0.22",
    "transformers>=4.40",
]
postgres = ["psycopg[binary]>=3.1"]
insar = ["asf_search>=8.0", "hyp3_sdk>=7.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "respx>=0.21"]

[project.scripts]
himsat = "himsat.cli:app"

[tool.setuptools.packages.find]
include = ["himsat*"]

[tool.setuptools.package-data]
himsat = ["py.typed", "alerts/prompts/*.txt", "db/migrations/*.ini", "db/migrations/*.py", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs internet access to STAC catalogs (deselect with -m 'not network')",
    "gpu: test needs a CUDA GPU",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
